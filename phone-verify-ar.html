<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بيلد كوت — تأكيد رقم الهاتف</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="./assets/icon.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'bc-green': '#5A7343',
            'bc-green-dark': '#4A6035',
            'bc-charcoal': '#1E2022',
            'bc-gray': '#6B7280'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="./style.css" />
</head>

<body class="font-sans bg-white text-bc-charcoal antialiased min-h-screen flex items-center justify-center px-4 py-10">

  <!-- ═══════════════════════════════════════════
       HEADER / NAVBAR
  ═══════════════════════════════════════════ -->
  <header id="site-header" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-white/90 backdrop-blur-md shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <nav class="flex items-center justify-between h-16">

        <!-- Logo -->
        <a href="./index-ar.html" id="nav-logo" class="flex items-center flex-shrink-0 group">
          <img src="./assets/llogo.png" alt="شعار بيلد كوت" class="h-14 sm:h-16 w-auto object-contain" />
        </a>

        <!-- Desktop Nav Links -->
        <ul class="hidden md:flex items-center gap-6 lg:gap-8" role="list">
          <li><a href="./index-ar.html" class="nav-link text-sm font-medium text-bc-charcoal hover:text-bc-green transition-colors duration-200">الرئيسية</a></li>
          <li><a href="./inventory-ar.html" class="nav-link text-sm font-medium text-bc-charcoal hover:text-bc-green transition-colors duration-200">المنتجات</a></li>
          <li><a href="./buildcalc-ar.html" class="nav-link text-sm font-medium text-bc-charcoal hover:text-bc-green transition-colors duration-200">حاسبة BuildCalc</a></li>
          <li><a href="./index-ar.html#orders" class="nav-link text-sm font-medium text-bc-charcoal hover:text-bc-green transition-colors duration-200">الطلبات</a></li>
          <li><a href="./index-ar.html#contact" class="nav-link text-sm font-medium text-bc-charcoal hover:text-bc-green transition-colors duration-200">من نحن</a></li>
        </ul>

        <!-- Mobile Hamburger -->
        <button id="hamburger-btn" class="md:hidden flex flex-col gap-1.5 p-2 rounded-lg hover:bg-gray-100 transition" aria-label="Toggle navigation" aria-expanded="false">
          <span class="hamburger-line block w-6 h-0.5 bg-bc-charcoal transition-all duration-300"></span>
          <span class="hamburger-line block w-6 h-0.5 bg-bc-charcoal transition-all duration-300"></span>
          <span class="hamburger-line block w-6 h-0.5 bg-bc-charcoal transition-all duration-300"></span>
        </button>
      </nav>
    </div>

    <!-- Mobile Menu -->
    <div id="mobile-menu"
         class="md:hidden hidden bg-white/95 backdrop-blur-md border-t border-gray-100 transition-all duration-300">
      <ul class="px-6 py-4 flex flex-col gap-3" role="list">
        <li><a href="./index-ar.html" class="block text-sm font-medium py-2 text-bc-charcoal hover:text-bc-green transition-colors" onclick="closeMobileMenu()">الرئيسية</a></li>
        <li><a href="./inventory-ar.html" class="block text-sm font-medium py-2 text-bc-charcoal hover:text-bc-green transition-colors" onclick="closeMobileMenu()">المنتجات</a></li>
        <li><a href="./buildcalc-ar.html" class="block text-sm font-medium py-2 text-bc-charcoal hover:text-bc-green transition-colors" onclick="closeMobileMenu()">حاسبة BuildCalc</a></li>
        <li><a href="./index-ar.html#orders" class="block text-sm font-medium py-2 text-bc-charcoal hover:text-bc-green transition-colors" onclick="closeMobileMenu()">الطلبات</a></li>
        <li><a href="./index-ar.html#contact" class="block text-sm font-medium py-2 text-bc-charcoal hover:text-bc-green transition-colors" onclick="closeMobileMenu()">من نحن</a></li>
      </ul>
    </div>
  </header>

  <main class="w-full max-w-md rounded-2xl border border-gray-100 shadow-xl p-6 sm:p-8">

    <a href="./signup-ar.html" id="back-link" class="inline-flex text-sm text-bc-green hover:text-bc-green-dark mb-6">
      ← رجوع للتسجيل
    </a>

    <h1 class="text-3xl font-black mb-2">تأكيد رقم الهاتف</h1>
    <p class="text-bc-gray text-sm mb-6">
      هنبعت لك رسالة SMS فيها كود تأكيد. قد تُطبَّق تكلفة الرسائل المعتادة.
    </p>

    <form id="phone-form" class="space-y-4">
      <div>
        <label for="phone-number" class="block text-sm font-bold mb-2">
          رقم الهاتف
        </label>

        <input
          id="phone-number"
          type="tel"
          inputmode="tel"
          autocomplete="tel"
          required
          placeholder="+201012345678"
          dir="ltr"
          class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-bc-green focus:ring-2 focus:ring-bc-green/20 outline-none"
        />

        <p class="text-xs text-bc-gray mt-2">
          اكتب الرقم بالصيغة الدولية، مثال: +201012345678.
        </p>
      </div>

      <button
        id="send-code-btn"
        type="submit"
        class="w-full bg-bc-green hover:bg-bc-green-dark text-white font-bold py-3.5 rounded-full transition-all"
      >
        إرسال الكود
      </button>
    </form>

    <form id="code-form" class="space-y-4 hidden mt-6">
      <div>
        <label for="verification-code" class="block text-sm font-bold mb-2">
          كود التأكيد
        </label>

        <input
          id="verification-code"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          required
          maxlength="6"
          placeholder="123456"
          dir="ltr"
          class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-bc-green focus:ring-2 focus:ring-bc-green/20 outline-none text-center tracking-[0.4em]"
        />
      </div>

      <button
        id="confirm-code-btn"
        type="submit"
        class="w-full bg-bc-green hover:bg-bc-green-dark text-white font-bold py-3.5 rounded-full transition-all"
      >
        تأكيد وإتمام
      </button>
    </form>

    <div id="recaptcha-container" class="mt-4"></div>

    <p id="phone-error" class="hidden mt-4 text-sm text-red-600 text-center" role="alert"></p>
    <p id="phone-status" class="hidden mt-4 text-sm text-bc-green text-center" role="status"></p>
  </main>

  <script src="./lang.js"></script>
  <script src="./script.js"></script>
  <script type="module" src="./auth-guard.js"></script>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import {
      RecaptchaVerifier,
      signInWithPhoneNumber,
      linkWithPhoneNumber,
      EmailAuthProvider,
      linkWithCredential,
      updateProfile,
      onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
    import {
      doc,
      setDoc,
      serverTimestamp
    } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';

    // ── تحديد التدفق اللي جاب الزائر للصفحة دي ──
    // 'signup' → تسجيل تقليدي بإيميل/باسورد (مفيش يوزر Firebase لسه).
    // 'google' → الزائر مسجل دخول بالفعل (جوجل/فيسبوك) ومحتاج بس نربط
    //            رقم التليفون ونحفظ اسمه الحقيقي.
    const pendingSignupRaw = sessionStorage.getItem('buildcoat_pending_signup');
    const pendingProfileRaw = sessionStorage.getItem('buildcoat_pending_profile');

    let mode = null;
    let pendingSignup = null;
    let pendingProfile = null;

    if (pendingSignupRaw) {
      mode = 'signup';
      pendingSignup = JSON.parse(pendingSignupRaw);
    } else if (pendingProfileRaw) {
      mode = 'google';
      pendingProfile = JSON.parse(pendingProfileRaw);
    } else {
      window.location.replace('./signup-ar.html');
    }

    const backLink = document.getElementById('back-link');
    if (mode === 'google') {
      backLink.href = './complete-profile-ar.html';
      backLink.textContent = '← رجوع';
    }

    const phoneForm = document.getElementById('phone-form');
    const codeForm = document.getElementById('code-form');
    const errorEl = document.getElementById('phone-error');
    const statusEl = document.getElementById('phone-status');

    let confirmationResult;
    let currentUser = null;

    auth.languageCode = 'ar';

    const recaptchaVerifier = new RecaptchaVerifier(
      auth,
      'recaptcha-container',
      { size: 'normal' }
    );

    // تدفق جوجل محتاج اليوزر المسجل دخول بالفعل قبل ما نقدر نربطله رقم تليفون.
    if (mode === 'google') {
      onAuthStateChanged(auth, (user) => {
        currentUser = user;
        if (!user) {
          window.location.replace('./login-ar.html');
        }
      });
    }

    function showError(error) {
      const messages = {
        'auth/invalid-phone-number':
          'رقم الهاتف غير صحيح. استخدم الصيغة الدولية مثل +201012345678.',
        'auth/invalid-verification-code':
          'كود التأكيد غير صحيح.',
        'auth/code-expired':
          'انتهت صلاحية الكود. أرسل كوداً جديداً.',
        'auth/too-many-requests':
          'تم تجاوز عدد المحاولات المسموح. حاول لاحقاً.',
        'auth/credential-already-in-use':
          'هذا البريد الإلكتروني مرتبط بحساب آخر. سجّل الدخول بدلاً من ذلك.',
        'auth/email-already-in-use':
          'هذا البريد الإلكتروني مستخدم بالفعل. سجّل الدخول بدلاً من ذلك.',
        'auth/provider-already-linked':
          'يوجد رقم هاتف مرتبط بهذا الحساب بالفعل.',
        'auth/no-current-user':
          'انتهت صلاحية الجلسة. سجّل الدخول مرة أخرى.'
      };

      errorEl.textContent = messages[error.code] || 'حصل خطأ. حاول مرة أخرى.';
      errorEl.classList.remove('hidden');
      statusEl.classList.add('hidden');
    }

    function setBusy(button, busy, label) {
      button.disabled = busy;
      button.classList.toggle('opacity-60', busy);

      if (busy) {
        button.dataset.label = button.textContent;
      }

      button.textContent = busy ? label : button.dataset.label;
    }

    phoneForm.addEventListener('submit', async function (event) {
      event.preventDefault();

      errorEl.classList.add('hidden');

      const button = document.getElementById('send-code-btn');
      const phone = document.getElementById('phone-number').value.trim();

      if (!/^\+[1-9]\d{7,14}$/.test(phone)) {
        showError({ code: 'auth/invalid-phone-number' });
        return;
      }

      try {
        setBusy(button, true, 'جاري الإرسال...');

        if (mode === 'google') {
          if (!currentUser) {
            throw { code: 'auth/no-current-user' };
          }
          confirmationResult = await linkWithPhoneNumber(currentUser, phone, recaptchaVerifier);
        } else {
          confirmationResult = await signInWithPhoneNumber(auth, phone, recaptchaVerifier);
        }

        phoneForm.classList.add('hidden');
        codeForm.classList.remove('hidden');

        statusEl.textContent = 'تم إرسال الكود. أدخله تحت لإتمام العملية.';
        statusEl.classList.remove('hidden');
      } catch (error) {
        showError(error);

        recaptchaVerifier.render().then(function (widgetId) {
          grecaptcha.reset(widgetId);
        });
      } finally {
        setBusy(button, false);
      }
    });

    codeForm.addEventListener('submit', async function (event) {
      event.preventDefault();

      const button = document.getElementById('confirm-code-btn');
      const code = document.getElementById('verification-code').value.trim();

      if (!confirmationResult || !/^\d{6}$/.test(code)) {
        showError({ code: 'auth/invalid-verification-code' });
        return;
      }

      try {
        setBusy(button, true, 'جاري التأكيد...');

        if (mode === 'google') {
          // بيربط رقم التليفون مباشرة باليوزر المسجل دخول بالفعل بجوجل/فيسبوك
          // — من غير ما يتعمل حساب جديد.
          const linkedResult = await confirmationResult.confirm(code);
          const finalUser = linkedResult.user;

          await updateProfile(finalUser, { displayName: pendingProfile.fullName });

          // Helper timeout function
          const timeout = (ms) => new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms));

          try {
            await Promise.race([
              setDoc(doc(db, 'users', finalUser.uid), {
                firstName: pendingProfile.firstName,
                middleName: pendingProfile.middleName,
                lastName: pendingProfile.lastName,
                fullName: pendingProfile.fullName,
                phoneNumber: finalUser.phoneNumber,
                email: finalUser.email || null,
                profileComplete: true,
                updatedAt: serverTimestamp()
              }, { merge: true }),
              timeout(8000)
            ]);
          } catch (e) {
            console.warn("Firestore setDoc timed out or failed, but auth linking succeeded.", e);
          }

          sessionStorage.removeItem('buildcoat_pending_profile');
        } else {
          // التسجيل التقليدي: تأكيد الهاتف بينشئ اليوزر، وبعدين بنربطله
          // بيانات الإيميل/الباسورد على نفس اليوزر.
          const phoneResult = await confirmationResult.confirm(code);

          const emailCredential = EmailAuthProvider.credential(
            pendingSignup.email,
            pendingSignup.password
          );

          const linkedResult = await linkWithCredential(phoneResult.user, emailCredential);
          const finalUser = linkedResult.user;

          await updateProfile(finalUser, { displayName: pendingSignup.displayName });

          // Helper timeout function
          const timeout = (ms) => new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms));

          try {
            await Promise.race([
              setDoc(doc(db, 'users', finalUser.uid), {
                firstName: pendingSignup.firstName,
                middleName: pendingSignup.middleName,
                lastName: pendingSignup.lastName,
                fullName: pendingSignup.displayName,
                phoneNumber: finalUser.phoneNumber,
                email: finalUser.email || null,
                profileComplete: true,
                createdAt: serverTimestamp()
              }, { merge: true }),
              timeout(8000)
            ]);
          } catch (e) {
            console.warn("Firestore setDoc timed out or failed, but auth linking succeeded.", e);
          }

          sessionStorage.removeItem('buildcoat_pending_signup');
        }

        window.location.replace('./index-ar.html');
      } catch (error) {
        showError(error);
      } finally {
        setBusy(button, false);
      }
    });
  </script>
</body>
</html>
