  <main class="w-full max-w-md rounded-2xl border border-gray-100 shadow-xl p-6 sm:p-8">
    <a href="./signup-ar.html" class="inline-flex text-sm text-bc-green hover:text-bc-green-dark mb-6">← رجوع للتسجيل</a>
    <h1 class="text-3xl font-black mb-2">تأكيد رقم الهاتف</h1>
    <p class="text-bc-gray text-sm mb-6">هنبعت لك رسالة SMS فيها كود تأكيد. قد تطبق تكلفة الرسائل المعتادة.</p>

    <form id="phone-form" class="space-y-4">
      <div>
        <label for="phone-number" class="block text-sm font-bold mb-2">رقم الهاتف</label>
        <input id="phone-number" type="tel" inputmode="tel" autocomplete="tel" required="" placeholder="+201012345678" dir="ltr" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-bc-green focus:ring-2 focus:ring-bc-green/20 outline-none">
        <p class="text-xs text-bc-gray mt-2">اكتب الرقم بالصيغة الدولية، مثال: +20 ثم الرقم المصري.</p>
      </div>
      <button id="send-code-btn" type="submit" class="w-full bg-bc-green hover:bg-bc-green-dark text-white font-bold py-3.5 rounded-full transition-all">إرسال الكود</button>
    </form>

    <form id="code-form" class="space-y-4 hidden mt-6">
      <div>
        <label for="verification-code" class="block text-sm font-bold mb-2">كود التأكيد</label>
        <input id="verification-code" type="text" inputmode="numeric" autocomplete="one-time-code" required="" maxlength="6" placeholder="123456" dir="ltr" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-bc-green focus:ring-2 focus:ring-bc-green/20 outline-none text-center tracking-[0.4em]">
      </div>
      <button id="confirm-code-btn" type="submit" class="w-full bg-bc-green hover:bg-bc-green-dark text-white font-bold py-3.5 rounded-full transition-all">تأكيد وإنشاء الحساب</button>
    </form>

    <div id="recaptcha-container" class="mt-4"></div>
    <p id="phone-error" class="hidden mt-4 text-sm text-red-600 text-center" role="alert"></p>
    <p id="phone-status" class="hidden mt-4 text-sm text-bc-green text-center" role="status"></p>
  </main>

  <script type="module">
    import { auth } from './firebase-config.js';
    import {
      RecaptchaVerifier,
      signInWithPhoneNumber,
      EmailAuthProvider,
      linkWithCredential,
      updateProfile
    } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';

    const pendingRaw = sessionStorage.getItem('buildcoat_pending_signup');
    if (!pendingRaw) window.location.replace('./signup-ar.html');
    const pending = JSON.parse(pendingRaw || '{}');
    const phoneForm = document.getElementById('phone-form');
    const codeForm = document.getElementById('code-form');
    const errorEl = document.getElementById('phone-error');
    const statusEl = document.getElementById('phone-status');
    let confirmationResult;

    auth.languageCode = 'ar';
    const recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { size: 'normal' });

    function showError(error) {
      const messages = {
        'auth/invalid-phone-number': 'رقم الهاتف غير صحيح. استخدم الصيغة الدولية مثل +201012345678.',
        'auth/invalid-verification-code': 'كود التأكيد غير صحيح.',
        'auth/code-expired': 'انتهت صلاحية الكود. أرسل كوداً جديداً.',
        'auth/too-many-requests': 'تم تجاوز عدد المحاولات المسموح. حاول لاحقاً.',
        'auth/credential-already-in-use': 'هذا البريد الإلكتروني مرتبط بحساب آخر. سجّل الدخول بدلاً من ذلك.',
        'auth/email-already-in-use': 'هذا البريد الإلكتروني مستخدم بالفعل. سجّل الدخول بدلاً من ذلك.'
      };
      errorEl.textContent = messages[error.code] || 'حصل خطأ. حاول مرة أخرى.';
      errorEl.classList.remove('hidden');
      statusEl.classList.add('hidden');
    }
    function setBusy(button, busy, label) {
      button.disabled = busy;
      button.classList.toggle('opacity-60', busy);
      if (busy) button.dataset.label = button.textContent;
      button.textContent = busy ? label : button.dataset.label;
    }

    phoneForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorEl.classList.add('hidden');
      const button = document.getElementById('send-code-btn');
      const phone = document.getElementById('phone-number').value.trim();
      if (!/^\+[1-9]\d{7,14}$/.test(phone)) return showError({ code: 'auth/invalid-phone-number' });
      try {
        setBusy(button, true, 'جاري الإرسال...');
        confirmationResult = await signInWithPhoneNumber(auth, phone, recaptchaVerifier);
        phoneForm.classList.add('hidden');
        codeForm.classList.remove('hidden');
        statusEl.textContent = 'تم إرسال الكود. أدخله لإتمام إنشاء الحساب.';
        statusEl.classList.remove('hidden');
      } catch (error) {
        showError(error);
        recaptchaVerifier.render().then((widgetId) => grecaptcha.reset(widgetId));
      } finally {
        setBusy(button, false);
      }
    });

    codeForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = document.getElementById('confirm-code-btn');
      const code = document.getElementById('verification-code').value.trim();
      if (!confirmationResult || !/^\d{6}$/.test(code)) return showError({ code: 'auth/invalid-verification-code' });
      try {
        setBusy(button, true, 'جاري تأكيد الحساب...');
        // تأكيد الـSMS ينشئ/يسجّل حساب الهاتف، ثم نربط به الإيميل والباسورد في نفس UID.
        const phoneResult = await confirmationResult.confirm(code);
        const emailCredential = EmailAuthProvider.credential(pending.email, pending.password);
        const linkedResult = await linkWithCredential(phoneResult.user, emailCredential);
        await updateProfile(linkedResult.user, { displayName: pending.displayName });
        sessionStorage.removeItem('buildcoat_pending_signup');
        window.location.replace('./index-ar.html');
      } catch (error) {
        showError(error);
      } finally {
        setBusy(button, false);
      }
    });
  </script>
